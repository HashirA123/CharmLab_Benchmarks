name: "boston_housing"
target_column: "target (label)"
train_split: 0.8
balance_classes: false
preprocessing_strategy: "standardize" # Options: normalize, standardize, min-max none
cache_dir: "./.data_cache" # For caching

feature_order: ["CRIM", "ZN", "INDUS", "CHAS", "NOX", "RM", "AGE", "DIS", "RAD", "TAX", "PTRATIO", "B", "LSTAT"]

# NOTE: CHAS and RAD are categorical, but the our original implementation kept them as numerical.
post_encoding_feat_order: ["CRIM", "ZN", "INDUS", "CHAS", "NOX", "RM", "AGE", "DIS", "RAD", "TAX", "PTRATIO", "B", "LSTAT"]

features:
  CRIM:
    short_name: "x0"
    type: "numerical"
    node_type: "input"
    mutability: True
    parent: null
    parent_short: null
    encode: null # Numeric, no encoding needed
    encoded_feature_names: null
    impute: "median" # Handle missing values dynamically
    domain: [17, 90] # Optional: can be used for validation or scaling
    
  ZN:
    short_name: "x1"
    type: "numerical"
    node_type: "input"
    mutability: True
    parent: null
